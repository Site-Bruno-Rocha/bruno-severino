    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Como funcionam as sessões?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "As sessões são feitas semanalmente com duração de 50 minutos no formato online utilizando a plataforma do Google Meet. Para uma boa experiência é importante que você disponha de uma conexão de internet estável e esteja em um local isolado para garantir privacidade e segurança. Recomendamos a utilização de fones de ouvido."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto tempo dura o tratamento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O tratamento é personalizado de acordo com as demandas de cada paciente. Sendo assim, não existe um prazo determinado para o fim."
          }
        },
        {
          "@type": "Question",
          "name": "Terapia online funciona?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Para muitas pessoas, o online funciona muito bem — inclusive por reduzir deslocamento e facilitar a consistência. O que mais importa é um ambiente minimamente reservado e uma boa conexão."
          }
        },
        {
          "@type": "Question",
          "name": "Terapia é só para quem está em crise?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. Muitas pessoas procuram terapia para prevenção, autoconhecimento, melhora de relacionamentos e para tomar decisões importantes com mais clareza. Você não precisa estar no limite para começar."
          }
        },
        {
          "@type": "Question",
          "name": "A partir de qual idade você atende?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A partir dos 15 anos. A adolescência é um período de muitas mudanças e a terapia pode ser uma ferramenta valiosa. Quando menor de 18 anos, é necessário que pelo menos um dos pais ou responsáveis esteja ciente e autorize o início do tratamento. Também atendo adultos de todas as idades."
          }
        },
        {
          "@type": "Question",
          "name": "Faz atendimento por convênio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Atendo todos os convênios por meio de reembolso. O paciente paga as sessões e recebe um recibo para enviar ao convênio. É um direito legal seu escolher o profissional que irá atendê-lo. Para descobrir o valor que seu convênio reembolsa, entre em contato com a central do seu convênio."
          }
        },
        {
          "@type": "Question",
          "name": "Qual o valor das sessões e as formas de pagamento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Por norma do Conselho Regional de Psicologia, não é permitido divulgar valores publicamente. Para saber o valor da sessão, entre em contato diretamente comigo. Trabalho com pagamento por sessão ou mensal, via Pix ou transferência bancária. É emitido recibo que pode ser usado para deduções no imposto de renda e reembolso no convênio."
          }
        }
      ]
    }
    </script>
